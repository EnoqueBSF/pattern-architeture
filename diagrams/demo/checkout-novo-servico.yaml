# yaml-language-server: $schema=../../schema/diagram.schema.json
version: 1
title: "Checkout — extracao do monolito"
description: Novo checkout-service assume o fluxo de pagamento; API Gateway ganha rota nova
direction: LR
locale: pt-BR

groups:
  - { id: clients, label: Clientes, kind: layer }
  - { id: edge, label: Borda, kind: layer }
  - { id: checkout, label: Checkout, kind: context }
  - { id: legacy, label: "Core (legado)", kind: context }
  - { id: payments, label: Pagamentos, kind: layer }

nodes:
  - { id: web, label: Web App, type: frontend-web, status: unchanged, tech: "React", group: clients }
  - { id: mobile, label: App Mobile, type: mobile-app, status: unchanged, tech: "React Native", group: clients }
  - id: gateway
    label: API Gateway
    type: api-gateway
    status: changed
    tech: "Kong 3.x"
    group: edge
    description: "Nova rota /checkout/* apontando para o checkout-service"
  - { id: core, label: core-legado, type: microservice, status: unchanged, tech: "PHP · Laravel", group: legacy }
  - { id: core-db, label: "Banco Core", type: database, status: unchanged, tech: "MySQL 8", group: legacy }
  - { id: checkout-svc, label: checkout-service, type: microservice, status: new, tech: "Node.js 22 · NestJS", group: checkout }
  - { id: checkout-db, label: "Banco Checkout", type: database, status: new, tech: "PostgreSQL 16 · RDS", group: checkout }
  - { id: checkout-events, label: checkout.events, type: queue, status: new, tech: "RabbitMQ", group: payments }
  - { id: payment-worker, label: payment-worker, type: worker, status: new, tech: "Node.js 22", group: payments }
  - { id: payment-gateway, label: "Gateway de Pagamento", type: external-service, status: unchanged, tech: "API v2" }

edges:
  - { from: web, to: gateway, protocol: http, label: "/checkout/*", status: new }
  - { from: mobile, to: gateway, protocol: http, label: "/checkout/*", status: new }
  - { from: gateway, to: core, protocol: http, label: resto da API }
  - { from: gateway, to: checkout-svc, protocol: http, label: REST }
  - { from: core, to: core-db, protocol: sql }
  - { from: checkout-svc, to: checkout-db, protocol: sql }
  - { from: checkout-svc, to: checkout-events, protocol: amqp, label: "publica pagamento.iniciado" }
  - { from: checkout-events, to: payment-worker, protocol: amqp, label: consome }
  - { from: payment-worker, to: payment-gateway, protocol: http, label: cobranca }
  - { from: payment-worker, to: checkout-db, protocol: sql, label: atualiza status }
